<!DOCTYPE html>
<html lang="ja">
   <head>
      <title>フラッピーバード：シンプルだけど激ムズ！中毒性抜群のスマホゲーム</title>
      <meta http-equiv="content-type" content="text/html; charset=utf-8" />
      <meta name="author" content="Nebez Briefkani" />
      <meta name="description" content="フラッピーバードは、タップするだけで遊べるシンプルなスマホゲームですが、その難易度と中毒性が話題に。攻略法や歴史、なぜ人気なのかを徹底解説します。" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

      <!-- Open Graph tags -->
      <meta property="og:title" content="フラッピーバード" />
      <meta property="og:description" content="フラッピーバードは、タップするだけで遊べるシンプルなスマホゲームですが、その難易度と中毒性が話題に。攻略法や歴史、なぜ人気なのかを徹底解説します。" />
      <meta property="og:type" content="website" />
      <meta property="og:image" content="https://kaloodinaz.github.io/flappybird/assets/thumb.png" />
      <meta property="og:url" content="https://kaloodinaz.github.io/flappybird/" />
      <meta property="og:site_name" content="フラッピーバード" />

      <!-- Style sheets -->
      <link href="css/reset.css" rel="stylesheet">
      <link href="css/main.css" rel="stylesheet">
   </head>
   <body>
      <div id="gamecontainer">
         <div id="gamescreen">
            <div id="sky" class="animated">
               <div id="flyarea">
                  <div id="ceiling" class="animated"></div>
                  <!-- This is the flying and pipe area container -->
                  <div id="player" class="bird animated"></div>

                  <div id="bigscore"></div>

                  <div id="splash"></div>

                  <div id="scoreboard">
                     <div id="medal"></div>
                     <div id="currentscore"></div>
                     <div id="highscore"></div>
                     <div id="replay"><img src="assets/replay.png" alt="replay"></div>
                  </div>

                  <!-- Pipes go here! -->
               </div>
            </div>
            <div id="land" class="animated"><div id="debug"></div></div>
         </div>
      </div>
      <div id="footer">
         <a href="https://www.dotgears.com/">original game/concept/art by dong nguyen</a>
         <a href="https://kaloodinaz.github.io/flappybird/">recreated by nebez briefkani</a>
         <a href="https://github.comkaloodinaz/flappybird/">view github project</a>
      </div>
      <div class="boundingbox" id="playerbox"></div>
      <div class="boundingbox" id="pipebox"></div>

      <script src="js/jquery.min.js"></script>
      <script src="js/jquery.transit.min.js"></script>
      <script src="js/buzz.min.js"></script>
      <script src="js/main.js"></script>

      <script>
      function inIframe() {
          try {
              return window.self !== window.top;
          } catch (e) {
              return true;
          }
      }
      </script>
  
   </body>
</html>
